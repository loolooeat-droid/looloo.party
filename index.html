<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LooLoo — Secret Night</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #101b16;
      color: #eee9dc;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(91, 107, 82, 0.16), transparent 35%),
        #101b16;
    }

    /* лёгкая текстура */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(173, 150, 91, 0.045);
      filter: blur(90px);
      animation: glow 7s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(0.9);
        opacity: 0.5;
      }
      to {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(90%, 600px);
      text-align: center;
      padding: 40px 20px;
    }

    .logo {
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 0.22em;
      margin-bottom: 70px;
      color: #eee9dc;
    }

    .secret {
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #b4a476;
      margin-bottom: 25px;
      opacity: 0;
      animation: appear 1.2s ease forwards;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(55px, 13vw, 105px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 35px;
      opacity: 0;
      animation: appear 1.2s ease 0.2s forwards;
    }

    .date {
      font-size: 15px;
      letter-spacing: 0.25em;
      color: #c7c0ae;
      margin-bottom: 55px;
      opacity: 0;
      animation: appear 1.2s ease 0.45s forwards;
    }

    .enter {
      appearance: none;
      border: 1px solid rgba(180, 164, 118, 0.65);
      background: transparent;
      color: #eee9dc;
      padding: 17px 38px;
      min-width: 190px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      cursor: pointer;
      transition:
        background 0.35s ease,
        color 0.35s ease,
        transform 0.35s ease;
      opacity: 0;
      animation: appear 1.2s ease 0.7s forwards;
    }

    .enter:hover {
      background: #b4a476;
      color: #101b16;
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 28px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(238, 233, 220, 0.4);
      opacity: 0;
      animation: appear 1.2s ease 0.9s forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Вторая страница */
    .details {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: #101b16;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition:
        opacity 0.7s ease,
        transform 0.7s ease,
        visibility 0.7s;
    }

    .details.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .details-inner {
      width: min(90%, 580px);
      padding: 40px 20px;
    }

    .small-logo {
      font-size: 20px;
      letter-spacing: 0.22em;
      margin-bottom: 65px;
    }

    .welcome {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 9vw, 65px);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 40px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin: 0 auto 45px;
      max-width: 430px;
      border-top: 1px solid rgba(238, 233, 220, 0.15);
      border-bottom: 1px solid rgba(238, 233, 220, 0.15);
    }

    .info-item {
      padding: 25px 10px;
    }

    .info-item + .info-item {
      border-left: 1px solid rgba(238, 233, 220, 0.15);
    }

    .label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #b4a476;
      margin-bottom: 10px;
    }

    .value {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
    }

    .description {
      font-size: 13px;
      line-height: 1.9;
      color: #c7c0ae;
      max-width: 380px;
      margin: 0 auto 38px;
    }

    .private {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b4a476;
    }

    .back {
      margin-top: 55px;
      border: none;
      background: transparent;
      color: rgba(238, 233, 220, 0.45);
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .logo {
        margin-bottom: 55px;
      }

      h1 {
        font-size: 62px;
      }

      .date {
        margin-bottom: 45px;
      }

      .content {
        padding: 30px 15px;
      }

      .small-logo {
        margin-bottom: 50px;
      }

      .info {
        max-width: 350px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="glow"></div>

    <!-- Первый экран -->
    <section class="content" id="landing">

      <div class="logo">LOOLOO</div>

      <div class="secret">Private invitation</div>

      <h1>Secret<br>Night</h1>

      <div class="date">20.09&nbsp;&nbsp;·&nbsp;&nbsp;21:00</div>

      <button class="enter" onclick="enterParty()">
        ENTER
      </button>

      <div class="hint">
        Только для наших клиентов
      </div>

    </section>

    <!-- Экран с информацией -->
    <section class="details" id="details">

      <div class="details-inner">

        <div class="small-logo">LOOLOO</div>

        <h2 class="welcome">
          Ты в списке.
        </h2>

        <div class="info">

          <div class="info-item">
            <span class="label">Дата</span>
            <span class="value">20.09</span>
          </div>

          <div class="info-item">
            <span class="label">Начало</span>
            <span class="value">21:00</span>
          </div>

        </div>

        <p class="description">
          Ночная вечеринка LooLoo.<br><br>
          Вход только для наших клиентов.
          Никакого dress code.
          Просто приходи.
        </p>

        <div class="private">
          Private event · LooLoo
        </div>

        <button class="back" onclick="backToStart()">
          ← назад
        </button>

      </div>

    </section>

  </main>

  <script>
    function enterParty() {
      document.getElementById('details').classList.add('active');
    }

    function backToStart() {
      document.getElementById('details').classList.remove('active');
    }
  </script>

</body>
</html>
